name: Build AYAZIeeAi APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q AYAZIeeAi-Android-source-v3-fixed.zip -d source
          PROJECT_DIR="$(find source -type f -name settings.gradle -print -quit | xargs dirname)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AYAZIeeAi-debug-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
